name: Build GIS Monitor
on:
  workflow_dispatch:
  push:
    branches: [ main, master, gis-monitor ]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: SDK packages
        run: |
          export SDK=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $SDK/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.1.0" "ndk;29.0.14206865" "cmake;3.22.1"
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
      - name: local.properties
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
      - name: Build
        run: ./gradlew --no-daemon assembleMobileLibre3SiNodexNogoogleRelease 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0
        shell: bash
      - name: Why failed
        if: failure()
        shell: bash
        run: |
          echo "::error title=Gradle::$(grep -n -i -E 'What went wrong|error:|FAILED|not found|Could not|No such|Execution failed' -A3 build.log | head -25 | tr '\n' '|' | cut -c1-3500)"
          echo "::error title=Variants::$(./gradlew --no-daemon -q tasks --all 2>/dev/null | grep -i '^assemble' | head -20 | tr '\n' '|')"
      - uses: actions/upload-artifact@v4
        with:
          name: GIS-Monitor-apk
          path: "**/build/outputs/apk/**/*.apk"
