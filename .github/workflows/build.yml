name: Build GIS Monitor
on:
  workflow_dispatch:
  push:
    branches: [ gis-monitor, gis-monitor-v2, solmi-sensor ]
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: SDK packages
        run: |
          export SDK=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          yes | $SDK/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $SDK/cmdline-tools/latest/bin/sdkmanager "platforms;android-37.1" "build-tools;37.0.0" "ndk;29.0.14206865" "cmake;4.1.2"
          echo "ANDROID_SDK_ROOT=$SDK" >> $GITHUB_ENV
      - name: local.properties
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
      - name: Постоянный ключ подписи
        env:
          KS: ${{ secrets.GIS_KEYSTORE_B64 }}
          KPW: ${{ secrets.GIS_KEY_PASSWORD }}
          SKS: ${{ secrets.SOLMI_KEYSTORE_B64 }}
          SPW: ${{ secrets.SOLMI_KEYSTORE_PASSWORD }}
          SAL: ${{ secrets.SOLMI_KEY_ALIAS }}
          SKP: ${{ secrets.SOLMI_KEY_PASSWORD }}
        run: |
          if [ "$GITHUB_REF" = "refs/heads/solmi-sensor" ]; then
            if [ -n "$SKS" ]; then
              printf '%s' "$SKS" | base64 -d > "$RUNNER_TEMP/solmi.jks"
              echo "SIGN=-Pthekeyfile=$RUNNER_TEMP/solmi.jks -Pthepassword=$SPW -Pthekeyalias=$SAL -Pthekeypassword=$SKP" >> $GITHUB_ENV
            else echo "::warning::нет секрета SOLMI_KEYSTORE_B64"; fi
          elif [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/gis.keystore"
            echo "SIGN=-Pthekeyfile=$RUNNER_TEMP/gis.keystore -Pthepassword=$KPW -Pthekeyalias=gismonitor -Pthekeypassword=$KPW" >> $GITHUB_ENV
            echo "RELEASE=1" >> $GITHUB_ENV
          fi
      - name: Build
        run: |
          ./gradlew --no-daemon -PgisBuild=${{ github.run_number }} $SIGN assembleMobileRelease 2>&1 | tee build.log; test ${PIPESTATUS[0]} -eq 0
          for f in $(find . -path "*/build/outputs/apk/*" -name "*.apk"); do $(ls $ANDROID_SDK_ROOT/build-tools/*/apksigner | tail -1) verify --print-certs "$f" | grep -i "SHA-256" || true; done
        shell: bash
      - name: Verify Solmi signature
        shell: bash
        run: |
          EXP=fb27861b3b589c6933f176aefa6d2bf129c61fb7daa91651aaa11e883cdfb283
          AS=$(ls ${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/*/apksigner | sort -V | tail -1)
          f=$(find . -path "*/build/outputs/apk/*" -name "*.apk" | head -1)
          GOT=$("$AS" verify --print-certs "$f" | grep -i "SHA-256 digest" | head -1 | sed 's/.*: *//' | tr -d ': ' | tr 'A-F' 'a-f')
          if [ "$GOT" = "$EXP" ]; then M="Подпись: ключ Solmi ✔"; else M="Подпись: чужой ключ ✘ ($GOT)"; fi
          echo "$M"; echo "$M" >> "$GITHUB_STEP_SUMMARY"
          [ "$GOT" = "$EXP" ]
      - name: Why failed
        if: failure()
        shell: bash
        run: |
          echo "::error title=Gradle::$(grep -n -i -E 'What went wrong|error:|FAILED|not found|Could not|No such|Execution failed' -A3 build.log | head -25 | tr '\n' '|' | cut -c1-3500)"
          echo "::error title=Kotlin::$(grep -E '^e: ' build.log | sed 's|file:///home/runner/work/JugglucoNG/JugglucoNG/||' | head -12 | tr '\n' '|' | cut -c1-3500)"
          echo "::error title=Variants::$(./gradlew --no-daemon -q tasks --all 2>/dev/null | grep -i '^assemble' | head -20 | tr '\n' '|')"
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: GIS-Monitor-apk
          retention-days: 14
          path: "**/build/outputs/apk/**/*.apk"
      # Канал обновлений Solmi Sensor: папка solmi-sensor/ в gis-updates; остальное там не трогаем.
      - name: Publish Solmi Sensor update channel
        if: github.ref == 'refs/heads/solmi-sensor'
        env:
          KEY: ${{ secrets.GIS_UPDATES_DEPLOY_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "Нет секрета GIS_UPDATES_DEPLOY_KEY (закрытый ключ deploy key с записью в gis-updates) — канал Solmi Sensor не обновлён" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          mkdir -p ~/.ssh; printf '%s\n' "$KEY" > ~/.ssh/gis_dk; chmod 600 ~/.ssh/gis_dk
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/gis_dk -o IdentitiesOnly=yes"
          D="$RUNNER_TEMP/gu"; git clone -q --depth 1 git@github.com:joojik5-spec/gis-updates.git "$D"
          f=$(find . -path "*/build/outputs/apk/*" -name "*.apk" | head -1)
          mkdir -p "$D/solmi-sensor"; cp "$f" "$D/solmi-sensor/solmi-sensor.apk"
          N=${{ github.run_number }}
          python3 - "$N" "$D/solmi-sensor" "$GITHUB_WORKSPACE" <<'PY'
          import hashlib, json, sys
          n, d, ws = sys.argv[1:4]; code = 1025 + int(n)
          try: prev = json.load(open(d + "/update-manifest.json", encoding="utf-8"))
          except Exception: prev = {}
          try: raw = open(ws + "/UPDATE_NOTES_SENSOR.txt", encoding="utf-8").read()
          except Exception: raw = ""
          lines = list(dict.fromkeys(l.strip().lstrip("•-").strip() for l in raw.splitlines() if l.strip()))
          text = "\n".join("• " + l for l in lines) or "• Исправления и улучшения"
          hist = [h for h in prev.get("history", []) if h.get("code") != code]
          if hist and hist[-1].get("notes") == text: text = "• Исправления и улучшения"
          hist = (hist + [{"code": code, "name": "solmi-sensor-1.0." + n, "notes": text}])[-40:]
          # приложение показывает одно поле notes: собираем изменения последних версий по группам, новые сверху
          notes = "\n\n".join(h.get("name", str(h["code"])) + "\n" + h["notes"] for h in reversed(hist[-10:]))
          b = open(d + "/solmi-sensor.apk", "rb").read()
          m = {"schema": 1, "versionName": "solmi-sensor-1.0." + n, "versionCode": code, "minSdk": 0, "notes": notes, "history": hist,
               "artifacts": [{"applicationId": "ru.solmi.sensor", "file": "solmi-sensor.apk", "size": len(b), "sha256": hashlib.sha256(b).hexdigest(), "url": "solmi-sensor.apk"}]}
          open(d + "/update-manifest.json", "w", encoding="utf-8").write(json.dumps(m, ensure_ascii=False) + "\n")
          PY
          cd "$D"; git add solmi-sensor; git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "solmi-sensor $N"
          for i in 1 2 3; do git push -q origin HEAD:main && break; git pull -q --rebase origin main; done
          echo "Канал Solmi Sensor: solmi-sensor-1.0.$N опубликована" >> "$GITHUB_STEP_SUMMARY"
      - name: Publish APK to monitor-apk branch
        if: github.ref != 'refs/heads/solmi-sensor'
        run: |
          f=$(find . -path "*/build/outputs/apk/*" -name "*.apk" | head -1)
          mkdir -p "$RUNNER_TEMP/apk"; cp "$f" "$RUNNER_TEMP/apk/gis-monitor.apk"
          cd "$RUNNER_TEMP/apk"
          N=${{ github.run_number }}
          SZ=$(stat -c %s gis-monitor.apk); SHA=$(sha256sum gis-monitor.apk | cut -d' ' -f1)
          printf '{"schema":1,"versionName":"1.2.5-GIS.%s","versionCode":%s,"minSdk":0,"notes":"Сборка %s","artifacts":[{"applicationId":"com.gismonitor","file":"gis-monitor.apk","size":%s,"sha256":"%s","url":"gis-monitor.apk"}]}\n' "$N" "$((1025+N))" "${GITHUB_SHA::7}" "$SZ" "$SHA" > update-manifest.json
          git init -q; git checkout -q -b monitor-apk; git add gis-monitor.apk update-manifest.json
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "APK for ${GITHUB_SHA}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" monitor-apk
      - name: Релиз для автообновлений
        if: env.RELEASE == '1' && github.ref == 'refs/heads/gis-monitor-v2'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=$(find . -path "*/build/outputs/apk/*" -name "JugglucoNG-*.apk" | head -1)
          tag="v1.2.5-GIS.${{ github.run_number }}"
          gh release create "$tag" "$f" --repo "${{ github.repository }}" --target "$GITHUB_SHA" --title "GIS Monitor ${{ github.run_number }}" --notes "Автоматическая сборка ${GITHUB_SHA::7}"

  emu:
    needs: apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GIS-Monitor-apk
          path: dl
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Find apk
        run: |
          find dl -name "*.apk" | head -3
          echo "APK=$(find dl -name '*.apk' | head -1)" >> $GITHUB_ENV
      - name: Launch on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: bash emu.sh
